<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محمد عيد لمهمات الأمن الصناعي</title>
  
  <!-- إعدادات PWA الرسمية للتشغيل كتطبيق -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="محمد عيد">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/942/942748.png">

  <!-- مكتبة حفظ الصفحة كصورة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --table-header: #f1f5f9;
      --table-border: #e2e8f0;
      --sticky-bg: #ffffff;
      
      --neon-blue: #00d2ff;
      --neon-blue-glow: rgba(0, 210, 255, 0.45);
      --neon-red: #ff2a5f;
      --neon-red-glow: rgba(255, 42, 95, 0.45);
      --neon-green: #00f076;
      --neon-green-glow: rgba(0, 240, 118, 0.45);
      --neon-gold: #ffbe0b;
      --neon-amber: #f59e0b;
    }

    [data-theme="dark"] {
      --bg: #090d16;
      --card-bg: #111827;
      --text: #f3f4f6;
      --border: #1f293d;
      --table-header: #1a2234;
      --table-border: #1f2937;
      --sticky-bg: #111827;
      
      --neon-blue: #38bdf8;
      --neon-blue-glow: rgba(56, 189, 248, 0.5);
      --neon-red: #fb7185;
      --neon-red-glow: rgba(251, 113, 133, 0.5);
      --neon-green: #4ade80;
      --neon-green-glow: rgba(74, 222, 128, 0.5);
      --neon-amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      direction: rtl;
    }

    .container {
      max-width: 950px;
      margin: 0 auto 20px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .top-bar-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tool-btn:hover {
      transform: translateY(-1px);
    }

    .tool-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .btn-pdf {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }

    .btn-img {
      border-color: var(--neon-green);
      color: var(--neon-green);
    }

    .btn-reset-month {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    header {
      background: radial-gradient(circle at center, #1e293b 0%, #0a0f1d 100%);
      padding: 24px 15px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .header-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--neon-gold);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(255, 190, 11, 0.3);
    }

    .icon-box svg {
      width: 36px;
      height: 36px;
      fill: var(--neon-gold);
      filter: drop-shadow(0 0 4px var(--neon-gold));
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.8),
                   0 0 20px rgba(0, 210, 255, 0.5),
                   0 0 35px rgba(0, 210, 255, 0.3);
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 16px 10px;
      border-radius: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card.sales {
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 16px var(--neon-blue-glow), inset 0 0 10px rgba(0, 210, 255, 0.1);
    }

    .stat-card.expenses {
      border: 2px solid var(--neon-red);
      box-shadow: 0 0 16px var(--neon-red-glow), inset 0 0 10px rgba(255, 42, 95, 0.1);
    }

    .stat-card.profit {
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 18px var(--neon-green-glow), inset 0 0 10px rgba(0, 240, 118, 0.1);
    }

    .stat-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    .stat-num {
      font-size: 1.25rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .sales .stat-num { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue-glow); }
    .expenses .stat-num { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red-glow); }
    .profit .stat-num { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green-glow); }

    .section-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .btn-add {
      background: #0f172a;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    [data-theme="dark"] .btn-add {
      background: #1e293b;
      border: 1px solid #334155;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--table-border);
      background: var(--card-bg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--table-border);
      vertical-align: middle;
      font-size: 0.92rem;
    }

    th {
      background: var(--table-header);
      color: var(--text);
      font-weight: 800;
      white-space: nowrap;
    }

    th.sticky-col, td.sticky-col {
      position: sticky;
      right: 0;
      background: var(--sticky-bg);
      z-index: 2;
      box-shadow: -2px 0 6px rgba(0,0,0,0.05);
      width: 140px;
      min-width: 130px;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 6px var(--neon-blue-glow);
    }

    textarea.multi-line {
      min-height: 85px;
      resize: vertical;
      line-height: 1.5;
      font-family: inherit;
    }

    .pay-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 95px;
      margin: 0 auto;
    }

    .pay-btn {
      padding: 7px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.65;
    }

    .pay-btn.cash-on {
      background: #0284c7 !important;
      border-color: var(--neon-blue) !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px var(--neon-blue), 0 0 25px var(--neon-blue-glow);
      opacity: 1;
      transform: scale(1.02);
    }

    .pay-btn.insta-on {
      background: #15803d !important;
      border-color: var(--neon-green) !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px var(--neon-green), 0 0 25px var(--neon-green-glow);
      opacity: 1;
      transform: scale(1.02);
    }

    .action-cell {
      display: flex;
      flex-direction: column;
      gap: 7px;
      justify-content: center;
      align-items: center;
      width: 85px;
      margin: 0 auto;
    }

    .btn-act {
      width: 100%;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .btn-act svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .btn-act-edit {
      background: rgba(245, 158, 11, 0.12);
      color: var(--neon-amber);
      border-color: var(--neon-amber);
    }

    .btn-act-save {
      background: rgba(0, 240, 118, 0.12);
      color: var(--neon-green);
      border-color: var(--neon-green);
    }

    .btn-act-del {
      background: rgba(255, 42, 95, 0.12);
      color: var(--neon-red);
      border-color: var(--neon-red);
    }

    .row-locked {
      background: rgba(0, 210, 255, 0.02);
    }

    .row-locked input, .row-locked textarea {
      opacity: 0.9;
      pointer-events: none;
      border-color: transparent;
      background: transparent;
      font-weight: 700;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1.5px solid var(--neon-red);
      box-shadow: 0 0 30px var(--neon-red-glow);
      border-radius: 20px;
      padding: 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      transform: scale(0.9);
      transition: all 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      background: rgba(255, 42, 95, 0.1);
      border: 2px solid var(--neon-red);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-icon svg {
      width: 28px;
      height: 28px;
      fill: var(--neon-red);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    .modal-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn-confirm-delete {
      background: linear-gradient(135deg, #ff2a5f, #e11d48);
      color: #fff;
    }

    .btn-cancel {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      .top-bar, .btn-add, .action-cell, th:last-child, td:last-child {
        display: none !important;
      }
      header {
        background: #0f172a !important;
        color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .stat-card {
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }
      input, textarea {
        border: none !important;
        background: transparent !important;
        resize: none;
      }
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.35rem; }
      .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container" id="reportArea">
    
    <div class="top-bar">
      <div class="top-bar-tools">
        <button class="tool-btn" id="themeBtn" onclick="toggleTheme()">
          🌙 الوضع الليلي
        </button>
        <button class="tool-btn btn-pdf" onclick="exportToPDF()">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          تصدير PDF
        </button>
        <button class="tool-btn btn-img" onclick="saveAsImage()">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          حفظ كصورة
        </button>
      </div>

      <button class="btn-reset-month" onclick="monthlyReset()">
        🔄 التصفير الشهري
      </button>
    </div>

    <header>
      <div class="header-icons">
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12v3c0 .55.45 1 1 1h18c.55 0 1-.45 1-1v-3c0-5.52-4.48-10-10-10zm-1 3.08V8h2V5.08c3.72.43 6.69 3.4 7.12 7.12H3.88C4.31 8.48 7.28 5.51 11 5.08zM4 17h16c1.1 0 2 .9 2 2v1H2v-1c0-1.1.9-2 2-2z"></path>
          </svg>
        </div>
        <div class="icon-box">
          <svg viewBox="0 0 24 24">
            <path d="M19 9c-.55 0-1 .45-1 1v2c0 2.97-2.16 5.43-5 5.91V16c0-.55-.45-1-1-1s-1 .45-1 1v1.91C8.16 17.43 6 14.97 6 12v-2c0-.55-.45-1-1-1s-1 .45-1 1v2.34c0 3.79 2.83 6.94 6.5 7.56V21h-3c-.55 0-1 .45-1 1s.45 1 1 1h9c.55 0 1-.45 1-1s-.45-1-1-1h-3v-1.1c3.67-.62 6.5-3.77 6.5-7.56V10c0-.55-.45-1-1-1zm-7-7C8.13 2 5 5.13 5 9v3.08c1.37.5 2.5 1.5 3.08 2.82.6-.33 1.25-.56 1.92-.7V11c0-1.1.9-2 2-2s2 .9 2 2v3.2c.67.14 1.32.37 1.92.7.58-1.32 1.71-2.32 3.08-2.82V9c0-3.87-3.13-7-7-7z"></path>
          </svg>
        </div>
      </div>
      <h1>محمد عيد لمهمات الأمن الصناعي</h1>
    </header>

    <div class="stats-row">
      <div class="stat-card sales">
        <div class="stat-title">إجمالي المبيعات</div>
        <div class="stat-num" id="totalSales">٠ ج.م</div>
      </div>
      <div class="stat-card expenses">
        <div class="stat-title">إجمالي المصروفات</div>
        <div class="stat-num" id="totalExp">٠ ج.م</div>
      </div>
      <div class="stat-card profit">
        <div class="stat-title">صافي الربح</div>
        <div class="stat-num" id="netProfit" style="color: var(--neon-green);">٠ ج.م</div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <div class="section-title">المبيعات</div>
        <button class="btn-add" onclick="addSaleRow()">
          <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          إضافة
        </button>
      </div>
      <div class="table-container">
        <table id="salesTable">
          <thead>
            <tr>
              <th class="sticky-col">الاسم</th>
              <th style="min-width: 220px;">المطلوب</th>
              <th style="min-width: 100px;">المبلغ</th>
              <th style="min-width: 110px;">الدفع</th>
              <th style="min-width: 95px;" class="col-act">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="salesBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <div class="section-title">المصروفات</div>
        <button class="btn-add" onclick="addExpenseRow()">
          <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          إضافة
        </button>
      </div>
      <div class="table-container">
        <table id="expenseTable">
          <thead>
            <tr>
              <th style="min-width: 220px;">المصروفات</th>
              <th style="min-width: 110px;">المبلغ</th>
              <th style="min-width: 95px;" class="col-act">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="expensesBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
        </svg>
      </div>
      <h3 style="margin-bottom:6px;">تأكيد الحذف</h3>
      <p style="font-size:0.9rem; opacity:0.8;">هل تريد حذف هذا البند بشكل نهائي؟</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
        <button class="modal-btn btn-confirm-delete" id="confirmDeleteBtn">نعم، احذف</button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('button')) playClickSound();
    });

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', next);
      document.getElementById('themeBtn').innerHTML = next === 'dark' ? '☀️ الوضع العادي' : '🌙 الوضع الليلي';
      localStorage.setItem('mohamed_eid_theme', next);
    }

    const iconEdit = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
    const iconSave = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
    const iconDel = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

    function exportToPDF() {
      window.print();
    }

    function saveAsImage() {
      const target = document.getElementById('reportArea');
      const topBar = document.querySelector('.top-bar');
      const addBtns = document.querySelectorAll('.btn-add');
      const actCols = document.querySelectorAll('.col-act, .action-cell');

      topBar.style.display = 'none';
      addBtns.forEach(b => b.style.display = 'none');
      actCols.forEach(c => c.style.display = 'none');

      html2canvas(target, {
        scale: 2,
        useCORS: true,
        backgroundColor: getComputedStyle(document.body).backgroundColor
      }).then(canvas => {
        topBar.style.display = 'flex';
        addBtns.forEach(b => b.style.display = 'inline-flex');
        actCols.forEach(c => c.style.display = '');

        const link = document.createElement('a');
        link.download = `تقرير_محمد_عيد_${new Date().toLocaleDateString('ar-EG')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        topBar.style.display = 'flex';
        addBtns.forEach(b => b.style.display = 'inline-flex');
        actCols.forEach(c => c.style.display = '');
        alert('حدث خطأ أثناء حفظ الصورة.');
      });
    }

    function addSaleRow(name = "", req = "", amount = "", payMethod = "") {
      const tbody = document.getElementById('salesBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="sticky-col">
          <input type="text" class="sale-name" placeholder="الاسم" value="${name}" oninput="saveData()">
        </td>
        <td>
          <textarea class="multi-line sale-req" placeholder="المطلوب..." oninput="saveData()">${req}</textarea>
        </td>
        <td>
          <input type="number" class="sale-amount" placeholder="0" value="${amount}" oninput="calculateAll(); saveData();">
        </td>
        <td>
          <div class="pay-container">
            <button type="button" class="pay-btn cash-btn ${payMethod === 'cash' ? 'cash-on' : ''}" onclick="togglePay(this, 'cash')">كاش</button>
            <button type="button" class="pay-btn insta-btn ${payMethod === 'insta' ? 'insta-on' : ''}" onclick="togglePay(this, 'insta')">إنستا</button>
          </div>
        </td>
        <td>
          <div class="action-cell">
            <button class="btn-act btn-act-edit" onclick="toggleEditRow(this)">
              ${iconEdit} <span>تعديل</span>
            </button>
            <button class="btn-act btn-act-del" onclick="openDeleteModal(this)">
              ${iconDel} <span>حذف</span>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
      calculateAll();
      saveData();
    }

    function addExpenseRow(desc = "", amount = "") {
      const tbody = document.getElementById('expensesBody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <textarea class="multi-line exp-desc" placeholder="بيان المصروفات..." oninput="saveData()">${desc}</textarea>
        </td>
        <td>
          <input type="number" class="exp-amount" placeholder="0" value="${amount}" oninput="calculateAll(); saveData();">
        </td>
        <td>
          <div class="action-cell">
            <button class="btn-act btn-act-edit" onclick="toggleEditRow(this)">
              ${iconEdit} <span>تعديل</span>
            </button>
            <button class="btn-act btn-act-del" onclick="openDeleteModal(this)">
              ${iconDel} <span>حذف</span>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
      calculateAll();
      saveData();
    }

    function togglePay(button, type) {
      const parent = button.closest('.pay-container');
      const cashBtn = parent.querySelector('.cash-btn');
      const instaBtn = parent.querySelector('.insta-btn');

      if (type === 'cash') {
        const isActive = cashBtn.classList.contains('cash-on');
        cashBtn.classList.toggle('cash-on', !isActive);
        instaBtn.classList.remove('insta-on');
      } else {
        const isActive = instaBtn.classList.contains('insta-on');
        instaBtn.classList.toggle('insta-on', !isActive);
        cashBtn.classList.remove('cash-on');
      }
      saveData();
    }

    function toggleEditRow(button) {
      const tr = button.closest('tr');
      const isLocked = tr.classList.contains('row-locked');
      if (isLocked) {
        tr.classList.remove('row-locked');
        button.innerHTML = `${iconEdit} <span>تعديل</span>`;
        button.className = "btn-act btn-act-edit";
      } else {
        tr.classList.add('row-locked');
        button.innerHTML = `${iconSave} <span>حفظ</span>`;
        button.className = "btn-act btn-act-save";
      }
      saveData();
    }

    let rowToDelete = null;

    function openDeleteModal(button) {
      rowToDelete = button.closest('tr');
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      rowToDelete = null;
      document.getElementById('deleteModal').classList.remove('active');
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
      if (rowToDelete) {
        rowToDelete.remove();
        calculateAll();
        saveData();
      }
      closeDeleteModal();
    });

    document.getElementById('deleteModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeDeleteModal();
    });

    function calculateAll() {
      let salesSum = 0;
      document.querySelectorAll('.sale-amount').forEach(inp => {
        salesSum += parseFloat(inp.value) || 0;
      });

      let expSum = 0;
      document.querySelectorAll('.exp-amount').forEach(inp => {
        expSum += parseFloat(inp.value) || 0;
      });

      const net = salesSum - expSum;

      document.getElementById('totalSales').textContent = salesSum.toLocaleString('ar-EG') + " ج.م";
      document.getElementById('totalExp').textContent = expSum.toLocaleString('ar-EG') + " ج.م";
      
      const profitEl = document.getElementById('netProfit');
      profitEl.textContent = net.toLocaleString('ar-EG') + " ج.م";
      profitEl.style.color = net < 0 ? "var(--neon-red)" : "var(--neon-green)";
    }

    function monthlyReset() {
      const ask = confirm("⚠️ تنبيه: هل تريد تصفير حسابات الشهر بالكامل ومسح كافة المبيعات والمصروفات المسجلة؟");
      if (ask) {
        document.getElementById('salesBody').innerHTML = "";
        document.getElementById('expensesBody').innerHTML = "";
        localStorage.removeItem('mohamed_eid_sales_v3');
        localStorage.removeItem('mohamed_eid_exp_v3');
        addSaleRow();
        addExpenseRow();
        calculateAll();
      }
    }

    function saveData() {
      const sales = [];
      document.querySelectorAll('#salesBody tr').forEach(tr => {
        const name = tr.querySelector('.sale-name').value;
        const req = tr.querySelector('.sale-req').value;
        const amount = tr.querySelector('.sale-amount').value;
        let payMethod = '';
        if (tr.querySelector('.cash-btn.cash-on')) payMethod = 'cash';
        if (tr.querySelector('.insta-btn.insta-on')) payMethod = 'insta';
        const isLocked = tr.classList.contains('row-locked');
        sales.push({ name, req, amount, payMethod, isLocked });
      });

      const expenses = [];
      document.querySelectorAll('#expensesBody tr').forEach(tr => {
        const desc = tr.querySelector('.exp-desc').value;
        const amount = tr.querySelector('.exp-amount').value;
        const isLocked = tr.classList.contains('row-locked');
        expenses.push({ desc, amount, isLocked });
      });

      localStorage.setItem('mohamed_eid_sales_v3', JSON.stringify(sales));
      localStorage.setItem('mohamed_eid_exp_v3', JSON.stringify(expenses));
    }

    function loadData() {
      const savedTheme = localStorage.getItem('mohamed_eid_theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeBtn').innerHTML = '☀️ الوضع العادي';
      }

      const sales = JSON.parse(localStorage.getItem('mohamed_eid_sales_v3') || '[]');
      const exp = JSON.parse(localStorage.getItem('mohamed_eid_exp_v3') || '[]');

      if (sales.length > 0) {
        sales.forEach(s => {
          addSaleRow(s.name, s.req, s.amount, s.payMethod);
          if (s.isLocked) {
            const lastRow = document.querySelector('#salesBody tr:last-child');
            lastRow.classList.add('row-locked');
            const btn = lastRow.querySelector('.btn-act-edit');
            btn.innerHTML = `${iconSave} <span>حفظ</span>`;
            btn.className = "btn-act btn-act-save";
          }
        });
      } else {
        addSaleRow();
      }

      if (exp.length > 0) {
        exp.forEach(e => {
          addExpenseRow(e.desc, e.amount);
          if (e.isLocked) {
            const lastRow = document.querySelector('#expensesBody tr:last-child');
            lastRow.classList.add('row-locked');
            const btn = lastRow.querySelector('.btn-act-edit');
            btn.innerHTML = `${iconSave} <span>حفظ</span>`;
            btn.className = "btn-act btn-act-save";
          }
        });
      } else {
        addExpenseRow();
      }
    }

    // تسجيل Service Worker لتحويله رسمياً إلى تطبيق PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker مسجل بنجاح!'))
          .catch(err => console.log('فشل تسجيل Service Worker:', err));
      });
    }

    window.onload = loadData;
  </script>
</body>
</html>
